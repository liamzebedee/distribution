<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MyTunes</title>
  <link rel="icon" href="../assets/mytunes.png">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="product-shell">
    <a class="back" href="../" aria-label="Back to apps">←</a>
    <main class="product-main" data-install="mytunes">
      <img class="product-icon" src="../assets/mytunes.png" alt="" width="512" height="512">
      <h1>MyTunes</h1>
      <div class="install">
        <label for="platform">Platform</label>
        <select id="platform">
          <option value="">Select platform</option>
          <option value="linux" data-file="MyTunes-linux-amd64.AppImage" data-url="https://github.com/liamzebedee/distribution/releases/latest/download/MyTunes-linux-amd64.AppImage">Linux AMD64</option>
          <option value="mac" data-file="MyTunes-macos-x86_64.tar.gz" data-url="https://github.com/liamzebedee/distribution/releases/latest/download/MyTunes-macos-x86_64.tar.gz">macOS Intel / Apple Silicon with Rosetta</option>
        </select>
        <div class="command">
          <code id="install-command" aria-live="polite"></code>
          <button type="button" class="copy-command" aria-label="Copy download command" disabled>Copy</button>
        </div>
      </div>
    </main>
  </div>
  <script src="../site.js" defer></script>
</body>
</html>
