<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>termset</title>
  <link rel="icon" href="../assets/termset.svg">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="product-shell">
    <a class="back" href="../" aria-label="Back to apps">←</a>
    <main class="product-main" data-install="termset">
      <img class="product-icon" src="../assets/termset.svg" alt="" width="256" height="256">
      <h1>termset</h1>
      <div class="install">
        <label for="platform">Platform</label>
        <select id="platform">
          <option value="">Select platform</option>
          <option value="linux" data-file="terms-linux-amd64" data-url="https://github.com/liamzebedee/distribution/releases/latest/download/terms-linux-amd64">Linux AMD64</option>
          <option value="mac" data-file="terms-macos-arm64" data-url="https://github.com/liamzebedee/distribution/releases/latest/download/terms-macos-arm64">macOS Apple Silicon</option>
        </select>
        <div class="command">
          <code id="install-command" aria-live="polite"></code>
          <button type="button" class="copy-command" aria-label="Copy download command" disabled>Copy</button>
        </div>
      </div>
    </main>
  </div>
  <script src="../site.js" defer></script>
</body>
</html>
