<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>termset</title>
  <link rel="icon" href="../assets/termset.svg">
  <link rel="preload" as="image" href="https://liamzebedee.com/blog/things-i-did-in-2026/terms.feff7b31f24d.png">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="product-shell">
    <a class="back" href="../" aria-label="Back to apps">←</a>
    <main class="product-main" data-install="termset">
      <div class="product-hero">
        <img class="product-icon" src="../assets/termset.svg" alt="" width="256" height="256">
        <h1>termset</h1>
        <a class="download-cta" href="#install">Download</a>
      </div>
      <img class="product-shot single-shot termset-shot" src="https://liamzebedee.com/blog/things-i-did-in-2026/terms.feff7b31f24d.png" alt="termset terminal workspace with vertical tabs" width="952" height="592" loading="eager">
      <section class="install" id="install" aria-labelledby="install-title">
        <div class="install-line" id="install-title">
          <span>Download and install for</span>
          <details class="platform-picker">
            <summary><span class="selected-platform">Linux</span><span class="picker-chevron" aria-hidden="true">⌄</span></summary>
            <div class="platform-menu">
              <button type="button" data-platform="linux" data-file="terms" data-url="https://github.com/liamzebedee/distribution/releases/latest/download/terms-linux-amd64">Linux</button>
              <button type="button" data-platform="mac" data-file="terms" data-url="https://github.com/liamzebedee/distribution/releases/latest/download/terms-macos-arm64">macOS</button>
            </div>
          </details>
        </div>
        <ol class="steps">
          <li>
            <h3>Copy this command</h3>
            <div class="command">
              <code id="install-command" aria-live="polite"></code>
              <button type="button" class="copy-icon" aria-label="Copy command" title="Copy command" disabled>
                <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"></path></svg>
                <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m4 12 5 5L20 6"></path></svg>
              </button>
              <span class="copy-status" role="status" aria-live="polite"></span>
            </div>
          </li>
          <li><h3>Run in shell</h3></li>
        </ol>
      </section>
    </main>
  </div>
  <script src="../site.js" defer></script>
</body>
</html>
